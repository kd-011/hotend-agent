name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so the badge reflects the real state of main and the repo never
  # goes quiet long enough for GitHub to pause its scheduled workflows.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }

      - name: vet
        run: CGO_ENABLED=0 go vet ./...

      # Built into the repo root, not dist/, because that is where the release
      # guards in main_test.go look for them — elsewhere they silently skip, and a
      # guard that skips is a guard that isn't protecting anything.
      - name: build all shipped architectures
        run: |
          for arch in amd64 arm64 arm; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "-s -w" -o "hotend-agent-linux-$arch" .
            if file "hotend-agent-linux-$arch" | grep -q 'dynamically linked'; then
              echo "hotend-agent-linux-$arch is dynamically linked — it would not start on an older printer image" >&2
              exit 1
            fi
            ls -l "hotend-agent-linux-$arch"
          done

      - name: test
        run: CGO_ENABLED=0 go test ./...

      # The README's try-it-now command. If the agent's startup or request
      # forwarding changes in a way the page no longer describes, this fails.
      - name: stand-in relay run (README example)
        run: |
          node scripts/stub-relay.mjs ./hotend-agent-linux-amd64 | tee stub.txt
          grep -q 'asks the agent: GET /printer/info' stub.txt
          grep -q 'moonraker GET /printer/info' stub.txt
          grep -q 'sent reply to request 2: status 200' stub.txt
